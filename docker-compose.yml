version: "3.9"

networks:
  appnet:
    driver: bridge

services:
  # Redis for caching and queuing
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - appnet
    volumes:
      - redis_data:/data

  # gRPC Server (single instance)
  grpc-server:
    build:
      context: ./microservice
      dockerfile: Dockerfile.grpc
    environment:
      - BART_API_KEY=${BART_API_KEY}
      - BART_API_URL=${BART_API_URL}
      - BART_API_URL_TWO=${BART_API_URL_TWO}
      - IMAGE_PIG_API_KEY=${IMAGE_PIG_API_KEY}
    networks:
      - appnet
    ports:
      - "8000:8000"

  # REST Server instances (for load balancing)
  rest1:
    build:
      context: ./microservice
      dockerfile: Dockerfile.rest
    environment:
      - REDIS_ADDR=redis:6379
      - GRPC_SERVER_ADDR=grpc-server:8000
      - PORT=90
    networks:
      - appnet
    depends_on:
      - redis
      - grpc-server

  rest2:
    build:
      context: ./microservice
      dockerfile: Dockerfile.rest
    environment:
      - REDIS_ADDR=redis:6379
      - GRPC_SERVER_ADDR=grpc-server:8000
      - PORT=90
    networks:
      - appnet
    depends_on:
      - redis
      - grpc-server

  # Worker instances
  worker1:
    build:
      context: ./microservice
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_ADDR=redis:6379
      - GRPC_SERVER_ADDR=grpc-server:8000
    networks:
      - appnet
    depends_on:
      - redis
      - grpc-server

  worker2:
    build:
      context: ./microservice
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_ADDR=redis:6379
      - GRPC_SERVER_ADDR=grpc-server:8000
    networks:
      - appnet
    depends_on:
      - redis
      - grpc-server

  # Nginx load balancer for REST servers
  nginx-rest:
    image: nginx:alpine
    ports:
      - "90:80"
    volumes:
      - ./microservice/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rest1
      - rest2
    networks:
      - appnet

  # Express Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - GRPC_SERVER_ADDR=grpc-server:8000
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    networks:
      - appnet
    ports:
      - "9000:9000"
    depends_on:
      - grpc-server
    volumes:
      - ./microservice/summarize:/app/proto/summarize:ro

  # Frontend (Next.js)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:9000
    networks:
      - appnet
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  redis_data:
